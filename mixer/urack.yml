
settings:
  width_hp: 6
graphics:
  type: inkscape_svg
  file: panel/channel_design.svg
  layers:
    # holes, centers, mounts, bounds
    holes:
      style: "fill:#cccccc"
    bounds: false
output:
  project: mixer.kicad_pcb
  start: [25.4, 41.541]
  copper_zone:
    fill: true
    layers: ['F.Cu', 'B.Cu']
components:
  jack:
    type: footprint
    footprint: synth:thonkiconn_hole
    hole:
      type: circle
      d: 6
    mount:
      type: circle
      d: 8
  pot:
    type: footprint
    footprint: synth:thonkiconn_hole
    hole:
      type: circle
      d: 7
    mount:
      type: circle
      d: 12
    bounds:
      # medium nut
      - type: circle
        d: 15
  thumbwheel:
    type: edgecut
    hole:
      type: rect
      size: [9, 4.5] # TODO: confirm
    center_offset: [0, 1.875] # the center of the footprint is ~2mm below the hole center
  toggle:
    type: edgecut
    hole:
      type: rect
      size: [5.5, 3] # TODO: confirm
  fader:
    type: edgecut
    hole:
      type: rect
      size: [4, 36] # TODO: confirm
    center_offset: [21.8444, 1.778]
  button:
    type: footprint
    footprint: synth:toggle_sw_hole
    hole:
      type: circle
      d: 5.2
    center_offset: [3.25, 2.25]
  mute_led:
    type: footprint
    footprint: _project:MUTE_CUTOUT
    center_offset: [1.27, 0]
    hole:
      type: rect
      size: [5.08, 5.08]
  solo_led:
    type: footprint
    footprint: _project:SOLO_CUTOUT
    center_offset: [1.27, 0]
    hole:
      type: rect
      size: [5.08, 5.08]
  screw:
    type: footprint
    footprint: synth:eurorack_screw_hole
    # TODO: rounded-rect instead of oval
    hole:
      type: oval
      size: [5.8, 4.2]
    mount:
      type: oval
      size: [4.8, 3.2]
elements:
  source: kicad
  project: mixer.kicad_pcb
  board:
    type: rect
    start: [76.2, 50.8]
    end: [106.68, 160.8]
  extra:
    compute_screws:
      compute: true
      type: screw
  footprints:
  - type: jack
    ref: J7
    name: IN 1
    panel_ref: J15
  - type: jack
    ref: J9
    name: IN 2
    panel_ref: J16
  - type: thumbwheel
    ref: RV3
    name: GAIN 1
  - type: thumbwheel
    ref: RV7
    name: GAIN 2
  - type: pot
    ref: RV5
    name: AUX SEND 1
    panel_ref: J17
  - type: pot
    ref: RV9
    name: AUX SEND 2
    panel_ref: J19
  - type: toggle
    ref: SW3
    name: PRE_POST 1
  - type: toggle
    ref: SW6
    name: PRE_POST 2
  - type: pot
    ref: RV6
    name: PAN 1
    panel_ref: J18
  - type: pot
    ref: RV10
    name: PAN 2
    panel_ref: J20
  - type: fader
    ref: RV4
    name: FADER 1
    translate: [-0.762, 0]
  - type: fader
    ref: RV8
    name: FADER 2
    translate: [-0.508, 0]
  - type: button
    ref: SW1
    name: MUTE BTN 1
    panel_ref: FID5
  - type: button
    ref: SW2
    name: SOLO BTN 1
    panel_ref: FID6
  - type: button
    ref: SW4
    name: MUTE BTN 2
    panel_ref: FID7
  - type: button
    ref: SW5
    name: SOLO BTN 2
    panel_ref: FID8
  - type: mute_led
    ref: D1
    name: MUTE LED 1
    panel_ref: FID10
  - type: solo_led
    ref: D2
    name: SOLO LED 1
    panel_ref: FID9
  - type: mute_led
    ref: D3
    name: MUTE LED 2
    panel_ref: FID12
  - type: solo_led
    ref: D4
    name: SOLO LED 2
    panel_ref: FID11
